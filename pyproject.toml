[project]
name = "jobradar"
version = "0.4.0"
description = "Radar-scan the job market against your CV — auto-discover, scrape and LLM-assess matching roles"
license = {text = "BUSL-1.1"}
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.92.0",
    "fastapi>=0.115.0",
    "google-auth-oauthlib>=1.2.2",
    "google-genai>=1.71.0",
    "openai>=2.31.0",
    "prometheus-client>=0.26.0",
    "prometheus-fastapi-instrumentator>=8.1.0",
    "pydantic>=2.12.5",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "python-jobspy==1.1.82",
    "python-multipart>=0.0.9",
    "requests>=2.33.1",
    "rich>=14.3.3",
    "tqdm>=4.67.1",
    "typer>=0.24.1",
    "uvicorn[standard]>=0.34.0",
]

[project.scripts]
jobradar = "jobradar.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jobradar*"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.14",
]

[tool.ruff]
# scripts/ 是一次性排查/分析脚本，不属于打包/测试范围，不做检查
extend-exclude = ["scripts"]

[tool.ruff.lint]
# E4/E7/E9 + F 是 ruff 默认集；额外启用：
#   I —— 导入顺序（此前完全未检查，新增 import 全靠肉眼排）
#   W —— 行尾空格等空白问题（W291/W293，改动时极易带入且 diff 里看不见）
# 刻意不启用 E501：现有代码有 613 行超过默认的 88 字符，一次性重排属于
# 大范围无关改动。行宽约束交给 review，不由 linter 强制。
select = ["E4", "E7", "E9", "F", "I", "W"]

[tool.pytest.ini_options]
addopts = ["--basetemp=.pytest_tmp"]
